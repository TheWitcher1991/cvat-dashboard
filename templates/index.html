<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>НЦМУ Мониторинг разметки — СтГАУ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090b;
      --bg-card: #18181b;
      --bg-hover: #27272a;
      --bg-muted: #1f1f23;
      --border: #27272a;
      --border-active: #3b82f6;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-bg: rgba(59, 130, 246, 0.1);
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.1);
      --yellow: #eab308;
      --yellow-bg: rgba(234, 179, 8, 0.1);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.1);
      --radius: 8px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html { font-size: 14px; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }

    header { margin-bottom: 28px; }
    header h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--text-muted); margin-top: 4px; font-size: 13px; }

    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .overview-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
    }
    .overview-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
    .overview-card .value { font-size: 26px; font-weight: 700; margin-top: 4px; letter-spacing: -0.02em; }

    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .section-title .count-badge { font-size: 11px; font-weight: 500; background: var(--bg-hover); color: var(--text-muted); padding: 2px 8px; border-radius: 99px; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab {
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.1s;
    }
    .tab:hover { background: var(--bg-hover); color: var(--text); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: white; }
    .tab .tab-count {
      display: inline-block;
      margin-left: 6px;
      font-size: 11px;
      opacity: 0.6;
    }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 9px 14px; font-weight: 500; color: var(--text-dim);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
      background: var(--bg-muted); border-bottom: 1px solid var(--border);
    }
    td { padding: 9px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-hover); }

    .user-info { display: flex; align-items: center; gap: 10px; }
    .user-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--accent-bg); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; flex-shrink: 0;
    }
    .user-name { font-weight: 500; }
    .user-username { color: var(--text-dim); font-size: 12px; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; font-size: 12px; font-weight: 500; font-family: var(--font);
      border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text); cursor: pointer; transition: all 0.1s; white-space: nowrap;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--text-dim); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-sm { padding: 4px 10px; font-size: 11px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
    .badge-completed { background: var(--green-bg); color: var(--green); }
    .badge-annotation { background: var(--accent-bg); color: var(--accent); }
    .badge-review { background: var(--yellow-bg); color: var(--yellow); }
    .badge-rejected { background: var(--red-bg); color: var(--red); }
    .badge-default { background: var(--bg-hover); color: var(--text-muted); }

    .stats-panel { margin-top: 20px; display: none; animation: fadeIn 0.15s ease; }
    .stats-panel.open { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .stats-panel .card { margin-bottom: 12px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-top: 12px; }
    .stat-item { text-align: center; padding: 12px; }
    .stat-item .stat-value { font-size: 22px; font-weight: 700; }
    .stat-item .stat-label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .status-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .alert { padding: 12px 16px; border-radius: var(--radius); border: 1px solid var(--red); background: var(--red-bg); color: var(--red); margin-bottom: 16px; font-size: 13px; display: none; }
    .alert.show { display: block; }

    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .toolbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .footer-text { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 40px; padding-bottom: 20px; }

    .empty-state { text-align: center; color: var(--text-dim); padding: 32px; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .overview-grid { grid-template-columns: repeat(2, 1fr); }
      td, th { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <header>
      <h1>НЦМУ Мониторинг разметки</h1>
      <p>СтГАУ · НЦМУ «Агроинженерия будущего»</p>
    </header>

    <div class="alert" id="errorAlert"></div>

    <div class="overview-grid" id="overview">
      <div class="overview-card"><div class="label">Проекты</div><div class="value" id="totalProjects">—</div></div>
      <div class="overview-card"><div class="label">Задачи</div><div class="value" id="totalTasks">—</div></div>
      <div class="overview-card"><div class="label">Jobs</div><div class="value" id="totalJobs">—</div></div>
      <div class="overview-card"><div class="label">Разметчики</div><div class="value" id="totalAnnotators">—</div></div>
    </div>

    <div class="toolbar">
      <div class="section-title">
        Разметчики
        <span class="count-badge" id="annotatorCount">0</span>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-primary" id="getStatsBtn" onclick="loadStats()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
          Получить статистику
        </button>
        <button class="btn" id="refreshBtn" onclick="loadStats()" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
          Обновить
        </button>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Пользователь</th>
            <th>Группа</th>
            <th>Projects</th>
            <th>Tasks</th>
            <th>Jobs</th>
            <th>Frames</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="annotatorsBody">
          <tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:32px;">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="stats-panel" id="statsPanel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div class="section-title" id="statsPanelTitle">Статистика</div>
        <button class="btn btn-sm" onclick="closeStats()">✕ Закрыть</button>
      </div>
      <div id="statsContent"></div>
    </div>

    <div class="footer-text">СтГАУ · НЦМУ «Агроинженерия будущего» · НЦМУ Мониторинг разметки</div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
